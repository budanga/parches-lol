name: update-data

on:
  schedule:
    # Riot publishes every two weeks, Tuesday or Wednesday between 18 and 20 UTC (seen in 47 patches):
    # every 15 minutes in that window, every 6 hours otherwise (news and mid-patch updates).
    - cron: "*/15 18-23 * * 2,3"
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm start
      - name: Commit data if it changed
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: actualización automática"
            git push
          else
            echo "Sin cambios en data/"
          fi
